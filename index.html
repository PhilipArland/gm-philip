<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grand Mirrors | Product Viewers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main>
        <section class="intro text-center px-3 py-4">
            <h1 class="mb-3 fw-bold">Explore Our Mirror Collection</h1>
            <p class="text-muted mt-3 mb-0 tip">
                <span>✦</span> Select a mirror to open its product viewer
            </p>
        </section>

        <section class="container-fluid px-2 px-sm-3 px-md-4 pb-5">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="display" id="display">
                        <img src="assets/img/grandmirrors.png" alt="Grand Mirrors product display">
                        <button class="hotspot m1" data-product="0" aria-label="View LUX mirror"></button>
                        <button class="hotspot m2" data-product="1" aria-label="View ECLIPSE mirror"></button>
                        <button class="hotspot m3" data-product="2" aria-label="View LUMIÈRE mirror"></button>
                        <button class="hotspot m4" data-product="3" aria-label="View ALLURE mirror"></button>
                        <button class="hotspot m5" data-product="4" aria-label="View HOLLYWOOD mirror"></button>
                        <button class="hotspot m6" data-product="5" aria-label="View ETCH mirror"></button>
                        <button class="hotspot m7" data-product="6" aria-label="View LED strip mirror"></button>
                        <button class="hotspot m8" data-product="7"
                            aria-label="View bevel and faucet demo mirror"></button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap JavaScript bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>

</body>

</html>
